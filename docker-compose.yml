services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: secondbrain_admin
      POSTGRES_PASSWORD: dev_admin_password
      POSTGRES_DB: secondbrain
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain_admin -d secondbrain"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Relationship layer. Rebuildable from PostgreSQL, so it keeps no volume:
  # a missing company graph is rebuilt on first use.
  falkordb:
    image: falkordb/falkordb:v4.22.3
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

volumes:
  pgdata:

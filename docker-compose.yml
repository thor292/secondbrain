services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: secondbrain_admin
      POSTGRES_PASSWORD: dev_admin_password
      POSTGRES_DB: secondbrain
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain_admin -d secondbrain"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Relationship layer. Rebuildable from PostgreSQL, so it keeps no volume:
  # a missing company graph is rebuilt on first use.
  falkordb:
    image: falkordb/falkordb:v4.22.3
    ports:
      - "56380:6379"
      # FalkorDB Browser, the graph's own viewer. Admin use only: it shows a
      # company's whole graph with no per-person permissions (the graph holds
      # entities and links, not memory text).
      - "53000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Event stream from client businesses (dev only: plain MQTT on 51883).
  # Production runs MQTTS on 8883; see docs/INTEGRATION.md.
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "51883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Live notifications OUT to people's screens (separate from ingest above).
  # Logins and ACL are generated from the grants table: run
  # `uv run python -m secondbrain.live sync --no-reload` before the first start.
  live-broker:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "51884:1883"   # backend publisher, CLI monitor
      - "59001:9001"   # WebSockets for browsers
    volumes:
      - ./docker/live-broker:/mosquitto/config
      - livedata:/mosquitto/data

volumes:
  pgdata:
  livedata:

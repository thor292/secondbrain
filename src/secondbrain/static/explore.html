<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondBrain Explore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%238b7bff'/></svg>">
<link rel="stylesheet" href="/static/sb.css">
<style>
  .head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .head h1 { margin: 6px 0 0; font-size: 32px; letter-spacing: -0.03em; }
  .persona { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .tabpane { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .denied { padding: 22px; border-radius: 14px; background: var(--bad-soft); border: 1px solid rgba(251,113,133,.3); }
  .denied b { color: var(--bad); }

  /* ---------- decision signals ---------- */
  .filters { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 20px 0 14px; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; }
  @media (max-width: 560px) { .sgrid { grid-template-columns: 1fr; } }
  .signal { --u: var(--violet); position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
            padding: 18px 18px 14px 22px; transition: transform .2s, border-color .2s, box-shadow .2s, opacity .4s; }
  .signal::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--u); box-shadow: 0 0 18px var(--u); }
  .signal:hover { transform: translateY(-2px); border-color: var(--border-hi); box-shadow: var(--shadow); }
  .signal.high { --u: var(--bad); } .signal.medium { --u: var(--warn); } .signal.low { --u: var(--faint); }
  .signal.closed { opacity: .6; }
  .signal.done { border-color: rgba(52,211,153,.6); box-shadow: 0 0 30px -8px rgba(52,211,153,.7); }
  .signal .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .signal .urg { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--u); }
  .signal h3 { margin: 10px 0 6px; font-size: 17px; line-height: 1.35; letter-spacing: -0.01em; }
  .signal .action { color: var(--muted); font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .signal.open-why .action { -webkit-line-clamp: unset; }
  .meter { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin: 14px 0 12px; font-size: 12px; color: var(--muted); }
  .meter .bar { height: 6px; border-radius: 99px; background: var(--panel-hi); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--grad); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .meter b { color: var(--text); font-variant-numeric: tabular-nums; }
  .signal .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .signal .foot .actions { margin-left: auto; display: flex; gap: 6px; }
  .signal .more { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 14px; }
  .signal.open-why .more { display: block; animation: rise .35s both; }
  .evidence { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .evidence li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 13px; color: var(--muted); }
  .evidence li::before { content: "•"; color: var(--cyan); font-weight: 800; }
  .evidence li.lesson::before { content: "★"; color: #f5c451; }
  .outcome { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; background: var(--panel-hi); }

  /* ---------- forecast ---------- */
  .fc-controls { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; margin: 18px 0; }
  .fc-controls label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .fc-top { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .fc-top { grid-template-columns: 1fr 1fr; } }
  .big { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .chartbox { position: relative; }
  .chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chartbox text { fill: var(--faint); font-size: 11px; font-family: Inter, system-ui; }
  .tooltip { position: absolute; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--border-hi); border-radius: 12px; padding: 10px 12px;
             font-size: 13px; box-shadow: var(--shadow); min-width: 150px; opacity: 0; transition: opacity .15s; z-index: 2; }
  .tooltip b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 18px; height: 4px; border-radius: 4px; margin-right: 7px; vertical-align: middle; }
  .draw { stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 1.8s cubic-bezier(.4,0,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { animation: fadein 1.2s .4s both; } @keyframes fadein { from { opacity: 0; } }
  .callout { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; margin: 14px 0; }
  .callout.alert { background: var(--bad-soft); border: 1px solid rgba(251,113,133,.35); }
  .callout.ok { background: var(--good-soft); border: 1px solid rgba(52,211,153,.35); }
  .callout .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; flex: none; }
  .callout.alert .ic { background: var(--bad); color: #fff; } .callout.ok .ic { background: var(--good); color: #052; }
  .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
  @media (max-width: 860px) { .pipeline { grid-template-columns: 1fr 1fr; gap: 14px; } }
  .pipeline .stp { position: relative; padding: 0 16px 0 0; }
  .pipeline .num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--grad);
                   box-shadow: 0 0 22px rgba(139,123,255,.55); position: relative; z-index: 1; }
  .pipeline .stp::after { content: ""; position: absolute; top: 19px; left: 38px; right: 0; height: 2px; background: linear-gradient(90deg, rgba(139,123,255,.6), rgba(51,214,242,.15)); }
  .pipeline .stp:last-child::after { display: none; }
  .pipeline h4 { margin: 12px 0 4px; font-size: 14.5px; } .pipeline p { margin: 0; font-size: 13px; color: var(--muted); }
  .drivers { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .driver { padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); }
  .driver .n { font-size: 12px; color: var(--muted); font-weight: 600; } .driver .v { font-size: 20px; font-weight: 800; margin: 4px 0; }
  .driver .e { font-size: 12.5px; color: var(--faint); }
  .bars { display: grid; gap: 10px; }
  .bars .b { display: grid; grid-template-columns: 220px 1fr 64px; gap: 12px; align-items: center; font-size: 13.5px; }
  .bars .track { height: 12px; border-radius: 99px; background: var(--panel-hi); overflow: hidden; }
  .bars .track i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--faint); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .bars .b.win .track i { background: var(--grad); box-shadow: 0 0 14px rgba(51,214,242,.5); } .bars .b.win { font-weight: 700; }
  .bars .val { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 220px; accent-color: var(--violet); }

  /* ---------- who knows what ---------- */
  .searchbar { display: flex; gap: 10px; margin: 18px 0 10px; }
  .searchbar input { flex: 1; font-size: 16px; padding: 13px 16px; border-radius: 14px; }
  .suggest { display: flex; gap: 8px; flex-wrap: wrap; }
  .suggest button { cursor: pointer; }
  .fgraph { display: grid; grid-template-columns: 1fr 300px; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; background: var(--panel); margin-top: 16px; }
  @media (max-width: 860px) { .fgraph { grid-template-columns: 1fr; } }
  .fgraph-main { position: relative; min-height: 560px;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px); background-size: 22px 22px; }
  .fgraph canvas { display: block; width: 100%; height: 560px; cursor: grab; }
  .fgraph .chips-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .fgraph .chips-bar .chip { color: #fff; border: 0; }
  .fgraph .chips-bar .chip.rel { background: var(--panel-solid); color: var(--muted); border: 1px solid var(--border); }
  .fgraph .hint { position: absolute; bottom: 10px; left: 14px; font-size: 12px; color: var(--faint); }
  .fgraph aside { border-left: 1px solid var(--border); padding: 18px; overflow-y: auto; max-height: 560px; font-size: 14px; background: var(--panel); }
  .fgraph aside h4 { margin: 8px 0 10px; font-size: 17px; }
  .fgraph aside .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 8px; font-size: 13px; }
  .fgraph aside .kv span:nth-child(odd) { color: var(--muted); }
  .fgraph aside .content { margin-top: 10px; font-size: 13px; white-space: pre-wrap; padding: 10px; border-radius: 10px; background: var(--panel-hi); }
  .fgraph aside .rel { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .fgraph aside code { color: var(--cyan); font-size: 12px; }
  .people { display: grid; gap: 10px; }
  .person { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; align-items: center; }
  .person .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--grad); }
  .person .track { height: 6px; border-radius: 99px; background: var(--panel-hi); margin-top: 6px; overflow: hidden; }
  .person .track i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width 1s; width: 0; }

  /* ---------- evolution ---------- */
  .tl { list-style: none; margin: 0; padding: 0 0 0 22px; position: relative; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--violet), transparent); }
  .tl li { position: relative; padding: 8px 0 12px; display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: baseline; }
  .tl li::before { content: ""; position: absolute; left: -21px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--violet)); box-shadow: 0 0 12px var(--c, var(--violet)); }
  .tl .when { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tl .what { font-size: 14px; } .tl .what .chip { margin-right: 8px; font-size: 11px; padding: 2px 8px; }
  .tl .what span.t { color: var(--muted); }
  .weekbars { display: flex; align-items: end; gap: 10px; height: 160px; padding-top: 10px; }
  .weekbars .w { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }
  .weekbars .col { width: 100%; max-width: 54px; border-radius: 10px 10px 4px 4px; background: var(--grad); height: 0; transition: height 1.2s cubic-bezier(.2,.8,.2,1);
                   box-shadow: 0 0 18px -4px rgba(51,214,242,.6); position: relative; }
  .weekbars .col span { position: absolute; top: -20px; left: 0; right: 0; text-align: center; color: var(--text); font-weight: 700; font-size: 12px; }
</style>
</head>
<body>
<main class="page">
  <div class="head">
    <div><div class="eyebrow" id="who-eyebrow">Lumen Home</div><h1>Explore the brain</h1></div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="signals" class="on">⚡ Decision signals</button>
      <button type="button" data-tab="forecast">📈 Sales forecast</button>
      <button type="button" data-tab="experts">🕸 Who knows what</button>
      <button type="button" data-tab="evolution">🧬 Brain evolution</button>
    </div>
  </div>
  <section id="tab-signals" class="tabpane"><div id="signals-out"></div></section>
  <section id="tab-forecast" class="tabpane hidden">
    <div class="fc-controls">
      <div><label>Product</label><select id="product"></select></div>
      <div><label>Days ahead: <b id="horizon-label">60</b></label><input type="range" id="horizon" min="7" max="120" step="1" value="60"></div>
    </div>
    <div id="forecast-out"></div>
  </section>
  <section id="tab-experts" class="tabpane hidden">
    <form id="search" class="searchbar">
      <input id="query" placeholder="Search a customer, supplier, product or topic…" required>
      <button class="btn primary">Search</button>
    </form>
    <div class="suggest" id="examples"></div>
    <div id="experts-out"></div>
  </section>
  <section id="tab-evolution" class="tabpane hidden"><div id="evolution-out"></div></section>
</main>
<script src="/static/sb.js"></script>
<script>
const { el, svg, money, shortMoney, pct, fmtDay, countUp, kpi } = SB;
const $ = (id) => document.getElementById(id);
const EXAMPLES = ["Priya Shah", "Nordlys", "Aria linen sofa", "Hearth Freight", "Black Friday", "Casa Forma", "UPS", "gross margin"];
const state = { user: null, filter: "all" };
const userSelect = el("select", { id: "user" });
SB.nav("explore", el("span", { class: "persona" }, "Viewing as", userSelect));

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { "X-User-Id": state.user, "Content-Type": "application/json", ...(options.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  return { status: res.status, body };
}
const who = () => userSelect.selectedOptions[0]?.textContent || "This person";
const denied = (what) => el("div", { class: "denied rise" }, el("b", {}, "Not visible. "), `${who()} isn't allowed to see ${what}, so the brain answers as if it doesn't exist.`);
const loading = (h = 220) => el("div", { class: "shimmer", style: { height: h + "px" } });
const daysUntil = (iso, today) => Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 864e5);

// ============ decision signals ============
const KIND = { stockout: ["📦", "Runs out"], backorder: ["⏳", "Out of stock"], excess_stock: ["📉", "Too much stock"], business: ["💡", "Business"] };
const OUTCOME = { prevented: ["good", "✓ Prevented"], happened: ["bad", "✕ Ran out"], happened_anyway: ["bad", "! Ran out anyway"], false_alarm: ["", "~ False alarm"] };

async function loadSignals() {
  const out = $("signals-out");
  out.replaceChildren(loading(110), el("div", { style: { height: "14px" } }), loading(260));
  const showClosed = state.showClosed || false;
  const [{ status, body }, quality, evo] = await Promise.all([api(`/signals?include_closed=${showClosed}`), api("/signals/quality"), api("/brain/evolution")]);
  if (status !== 200) { out.replaceChildren(el("div", { class: "denied" }, "Couldn't load signals.")); return; }
  const today = evo.body?.today || new Date().toISOString().slice(0, 10);
  const open = body.filter((s) => s.status === "open");
  const q = quality.status === 200 ? quality.body : null;
  const kpis = el("div", { class: "kpis" },
    kpi("Open signals", open.length, { glow: "glow" }),
    kpi("Urgent", open.filter((s) => s.urgency === "high").length, { cls: "bad", delay: 70 }),
    kpi("Money at stake", open.reduce((t, s) => t + (s.impact_value || 0), 0), { format: shortMoney, delay: 140 }),
    kpi("Track record", q && q.prevented + q.warnings_came_true ? `${q.prevented} saved` : "Learning", {
      d: q && q.saved ? shortMoney(q.saved) + " of sales protected" : "outcomes are judged as time passes", glow: "glow-good", delay: 210, tip: q?.summary }));
  const filters = el("div", { class: "seg" }, [["all", "All"], ["stock", "📦 Stock"], ["business", "💡 Business"]].map(([k, label]) =>
    el("button", { type: "button", class: state.filter === k ? "on" : "", onclick: () => { state.filter = k; loadSignals(); } }, label)));
  const toggle = el("label", { class: "muted", style: { fontSize: "13px", display: "flex", gap: "6px", alignItems: "center" } },
    el("input", { type: "checkbox", checked: showClosed || null, onchange: (e) => { state.showClosed = e.target.checked; loadSignals(); } }), "Show answered");
  const shown = body.filter((s) => state.filter === "all" || (state.filter === "business") === (s.kind === "business"));
  const grid = el("div", { class: "sgrid" }, shown.map((s, i) => signalCard(s, today, i)));
  out.replaceChildren(kpis, el("div", { class: "filters" }, filters, toggle),
    shown.length ? grid : el("div", { class: "card empty" }, `No signals ${who()} is allowed to see here.`));
}

function signalCard(s, today, i) {
  const [icon, kindLabel] = KIND[s.kind] || ["•", s.kind];
  const card = el("div", { class: `signal rise ${s.urgency}${s.status !== "open" ? " closed" : ""}`, style: { animationDelay: Math.min(i, 8) * 60 + "ms" } });
  const fill = el("i");
  const due = s.due ? daysUntil(s.due, today) : null;
  const dueChip = s.due ? el("span", { class: "chip " + (due <= 0 ? "bad" : due <= 7 ? "warn" : "") },
    due < 0 ? `⏰ ${-due}d overdue` : due === 0 ? "⏰ Act today" : `⏰ Act by ${fmtDay(s.due)} · ${due}d`) : null;
  card.append(
    el("div", { class: "top" }, el("span", { class: "urg" }, "● " + s.urgency), el("span", { class: "chip" }, icon + " " + kindLabel),
      s.evidence.lessons?.length ? el("span", { class: "chip accent", title: "Uses lessons learned across businesses" }, "★ Learned across businesses") : null),
    el("h3", {}, s.title),
    el("div", { class: "action" }, s.action),
    el("div", { class: "meter" }, el("span", {}, "Confidence"), el("div", { class: "bar" }, fill), el("b", {}, pct(s.confidence))));
  setTimeout(() => (fill.style.width = s.confidence * 100 + "%"), 150 + i * 60);

  const more = el("div", { class: "more" }, el("div", {}, s.reason), s.impact ? el("div", { class: "muted", style: { marginTop: "6px" } }, "Impact: " + s.impact) : null);
  const ev = el("ul", { class: "evidence" });
  for (const f of s.evidence.facts || []) ev.append(el("li", {}, f));
  for (const p of s.evidence.products || []) ev.append(el("li", {}, el("a", { href: "#", onclick: (e) => { e.preventDefault(); showTab("forecast"); $("product").value = p.sku; loadForecast(); } }, "Open this product's forecast →")));
  for (const n of s.evidence.notes || []) ev.append(el("li", {}, `${n.created_by ? n.created_by + ", " : ""}${n.brain.split(".").pop()} (${fmtDay(n.created_at)}): ${n.content}`));
  for (const l of s.evidence.lessons || []) ev.append(el("li", { class: "lesson" }, l));
  more.append(ev);

  const why = el("button", { type: "button", class: "btn ghost sm", onclick: () => { card.classList.toggle("open-why"); why.textContent = card.classList.contains("open-why") ? "Hide" : "Why?"; } }, "Why?");
  const actions = el("div", { class: "actions" });
  if (s.status === "open") {
    const answer = async (status) => {
      const note = status === "dismissed" ? prompt("Why dismiss it? (optional, helps the brain learn)") : null;
      if (status === "acted") card.classList.add("done");
      await api(`/signals/${s.id}/feedback`, { method: "POST", body: JSON.stringify({ status, note }) });
      card.style.opacity = 0; setTimeout(loadSignals, 450);
    };
    actions.append(why, el("button", { type: "button", class: "btn ghost sm", onclick: () => answer("dismissed") }, "Dismiss"),
      el("button", { type: "button", class: "btn good sm", onclick: () => answer("acted") }, "✓ Done"));
  } else {
    actions.append(why, el("button", { type: "button", class: "btn ghost sm", onclick: async () => {
      await api(`/signals/${s.id}/feedback`, { method: "POST", body: JSON.stringify({ status: "open" }) }); loadSignals(); } }, "Reopen"));
  }
  const money = s.impact_value ? el("span", { class: "chip", title: s.impact }, "💰 " + shortMoney(s.impact_value) + " at stake") : null;
  card.append(el("div", { class: "foot" }, money, s.status === "open" ? dueChip : null, actions), more);
  if (s.status !== "open") {
    const [cls, label] = OUTCOME[s.outcome] || ["", s.status === "expired" ? "Expired unanswered" : s.status === "acted" ? "Acted on" : "Dismissed"];
    card.append(el("div", { class: "outcome" }, el("span", { class: "chip " + cls }, label), " ",
      s.outcome_detail || (s.feedback_by ? `by ${s.feedback_by}${s.feedback_note ? ": " + s.feedback_note : ""}` : "")));
  }
  return card;
}

// ============ sales forecast ============
async function loadProducts() {
  const { status, body } = await api("/forecast/products");
  const select = $("product");
  select.replaceChildren();
  if (status !== 200 || !body.length) {
    for (const [sku, name] of [["halo-lamp", "Halo brass floor lamp"], ["aria-sofa", "Aria linen sofa"]]) select.append(el("option", { value: sku }, name));
  } else {
    for (const p of body) select.append(el("option", { value: p.sku }, p.name));
    select.value = body.some((p) => p.sku === "halo-lamp") ? "halo-lamp" : body[0].sku;
  }
  loadForecast();
}

const LABELS = { seasonal_naive: "Repeat last week", year_over_year: "Last year × growth", ets: "ETS (statistical)", gradient_boosting: "Gradient boosting",
  croston: "Croston (sporadic)", tsb: "TSB (sporadic)", adida: "ADIDA (sporadic)", cold_start: "Recent average (new)", discontinued: "Zero (stopped)", no_sales: "Zero (no sales yet)" };
const label = (m) => LABELS[m] || m;
const DRIVER_ICON = { "Recent level": "📍", Growth: "🚀", "Weekday rhythm": "📅", "Same weeks last year": "🔁", Promotions: "🏷️", "Black Friday effect": "🛍️" };

async function loadForecast() {
  const out = $("forecast-out");
  out.replaceChildren(loading(140), el("div", { style: { height: "14px" } }), loading(340));
  const { status, body } = await api(`/forecast?product=${encodeURIComponent($("product").value)}&horizon=${$("horizon").value}&history=120`);
  if (status === 400 && body.detail) { out.replaceChildren(el("div", { class: "denied" }, body.detail)); return; }
  if (status !== 200) { out.replaceChildren(denied("Merchandising's sales data")); return; }

async function search(query) {
  $("query").value = query;
  const out = $("experts-out");
  out.replaceChildren(el("div", { style: { height: "16px" } }), loading(480));
  const [experts, entity] = await Promise.all([api(`/experts?topic=${encodeURIComponent(query)}`), api(`/entities/${encodeURIComponent(query)}`)]);
  const people = experts.status === 200 ? experts.body.people : [];
  if (!people.length && entity.status !== 200) { out.replaceChildren(el("div", { style: { height: "16px" } }), denied(`anything about "${query}"`)); return; }
  G.nodes = new Map(); G.edges = []; G.selected = null; G.view = { x: 0, y: 0, k: 1 };
  const parts = [];
  if (entity.status === 200) {
    parts.push(graphPanel());
    G.center = mergeEntity(entity.body, { x: 0, y: 0 }); G.center.x = 0; G.center.y = 0;
    renderChips(); G.selected = G.center; showDetails(G.center);
  }
  const most = Math.max(1, ...people.map((p) => p.memories));
  const list = el("div", { class: "card section" }, el("div", { class: "section-head" }, el("div", {}, el("h2", {}, `Who knows about “${query}”`),
    el("p", {}, experts.status === 200 && experts.body.brains.length ? "Held in " + experts.body.brains.map((b) => `${b.name} (${b.memories})`).join(" · ") : "Only people this viewer may see."))),
    people.length ? el("div", { class: "people" }, people.map((p, i) => {
      const fill = el("i"); setTimeout(() => (fill.style.width = (p.memories / most) * 100 + "%"), 150 + i * 80);
      return el("div", { class: "person rise", style: { animationDelay: i * 70 + "ms" } }, el("div", { class: "av" }, p.name[0]),
        el("div", {}, el("div", {}, el("b", {}, p.name.replace(/\s*\(.*\)/, "")), el("span", { class: "muted", style: { fontSize: "13px" } }, " " + (p.name.match(/\((.*)\)/)?.[1] || ""))),
          el("div", { class: "track" }, fill)),
        el("span", { class: "chip" }, `${p.memories} memor${p.memories === 1 ? "y" : "ies"}`));

}

// ============ brain evolution ============
const TL_COLOR = { prevented: "var(--good)", acted: "var(--good)", happened: "var(--bad)", happened_anyway: "var(--bad)", expired: "var(--bad)", false_alarm: "var(--faint)", dismissed: "var(--faint)" };
async function loadEvolution() {
  const out = $("evolution-out");
  out.replaceChildren(loading(110), el("div", { style: { height: "14px" } }), loading(260));
  const { status, body } = await api("/brain/evolution");
  if (status !== 200) { out.replaceChildren(el("div", { class: "denied" }, "Couldn't load.")); return; }
  const o = body.outcomes, f = body.feedback, n = (k) => (o[k] ? o[k].count : 0);
  const kpis = el("div", { class: "kpis" },
    kpi("Brain's date", body.today ? fmtDay(body.today) : "—", { glow: "glow" }),
    kpi("Run-outs prevented", n("prevented"), { cls: "good", glow: "glow-good", delay: 60 }),
    kpi("Sales saved", body.saved || 0, { format: shortMoney, cls: "good", delay: 120 }),
    kpi("Lost when ignored", body.lost || 0, { format: shortMoney, cls: body.lost ? "bad" : "", delay: 180 }),
    kpi("Warnings that came true", body.warning_accuracy == null ? "—" : body.warning_accuracy * 100, { format: (x) => Math.round(x) + "%", delay: 240 }),
    kpi("Answered", `${f.acted || 0} / ${f.dismissed || 0}`, { d: `acted / dismissed · ${f.expired || 0} expired`, delay: 300 }));
  const parts = [kpis];
  if (body.accuracy) parts.push(accuracyCard(body.accuracy));
  const tl = el("ul", { class: "tl" });
  const LABEL = { outcome: "Outcome", feedback: "Answer", expired: "Expired", updated: "Fact" };
  body.events.slice(0, 18).forEach((e, i) => {
    const [headline] = e.text.split(" — ");
    tl.append(el("li", { class: "rise", title: e.text + (e.who ? ` — ${e.who}` : ""), style: { "--c": TL_COLOR[e.label] || "var(--violet)", animationDelay: i * 40 + "ms" } },
      el("span", { class: "when" }, e.at ? fmtDay(e.at) : ""),
      el("div", { class: "what" }, el("span", { class: "chip" }, e.kind === "updated" ? "Fact " + e.label : `${LABEL[e.kind]}: ${e.label.replace("_", " ")}`),
        el("span", { class: "t" }, headline.replace(/^Outcome: /, "")))));
  });
  parts.push(el("div", { class: "card section" }, el("div", { class: "section-head" }, el("div", {}, el("h2", {}, "What the brain learned"),
    el("p", {}, "Outcomes, answers and facts it updated, most recent first. Hover for details."))),
    body.events.length ? tl : el("div", { class: "empty" }, "Nothing yet. Answer signals; outcomes appear as time passes (HQ can run weeks).")));

function accuracyCard(a) {
  const r = a.recent;
  const weeks = a.weeks.filter((w) => w.forecasts && w.forecasts.wape != null).slice(-10);
  const bars = el("div", { class: "weekbars" }, weeks.map((w, i) => {
    const acc = Math.max(0, 1 - w.forecasts.wape), col = el("div", { class: "col" }, el("span", {}, pct(acc)));
    setTimeout(() => (col.style.height = acc * 120 + "px"), 200 + i * 80);
    return el("div", { class: "w" }, col, fmtDay(w.week));
  }));
  return el("div", { class: "card section" }, el("div", { class: "section-head" }, el("div", {}, el("h2", {}, "The brain grades its own forecasts"),
    el("p", {}, "Every forecast is checked against what really sold."))),
    r ? el("div", { class: "kpis" },
      kpi("Accuracy", (1 - r.wape) * 100, { format: (x) => Math.round(x) + "%", glow: "glow-good", tip: a.summary }),
      kpi("Days inside the 80% range", r.coverage80 * 100, { format: (x) => Math.round(x) + "%", delay: 60 }),
      kpi("Bias", r.bias == null ? "—" : `${pct(Math.abs(r.bias))} ${r.bias > 0 ? "high" : "low"}`, { delay: 120 }),
      kpi("Product-days graded", r.days, { delay: 180 })) : el("div", { class: "empty" }, "Graded once real sales arrive."),
    weeks.length > 1 ? el("div", { class: "section" }, el("div", { class: "eyebrow" }, "Accuracy week by week"), bars) : null);
}

// ============ setup ============
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["signals", "forecast", "experts", "evolution"]) $("tab-" + t).classList.toggle("hidden", t !== name);
  if (name === "evolution") loadEvolution();
  const url = new URL(location); url.searchParams.set("tab", name); history.replaceState(null, "", url);
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
let horizonTimer = null;
$("horizon").oninput = () => { $("horizon-label").textContent = $("horizon").value; clearTimeout(horizonTimer); horizonTimer = setTimeout(loadForecast, 350); };
$("product").onchange = () => loadForecast();
$("search").onsubmit = (e) => { e.preventDefault(); search($("query").value.trim()); };

async function init() {
  const res = await fetch("/demo/users");
  const users = res.ok ? await res.json() : [];
  for (const u of users) userSelect.append(el("option", { value: u.id }, u.name));
  const params = new URLSearchParams(location.search), wanted = params.get("user");
  userSelect.value = users.some((u) => u.id === wanted) ? wanted : (users.find((u) => u.id === "omar") || users[0]).id;
  state.user = userSelect.value;
  $("who-eyebrow").textContent = "Lumen Home · " + who();
  $("examples").replaceChildren(...EXAMPLES.map((q) => el("button", { type: "button", class: "chip", onclick: () => search(q) }, q)));
  const tab = params.get("tab");
  if (["experts", "forecast", "evolution"].includes(tab)) showTab(tab);
  loadSignals(); loadProducts(); requestAnimationFrame(graphLoop); goLive();
}
// Live: a new decision signal appears the moment the brain raises it.
const URG = { high: "Urgent", medium: "Soon", low: "Watch" };
const onSignals = SB.batcher(1200, (items) => {
  const urgent = items.filter((m) => m.detail?.urgency === "high").length;
  SB.toast(urgent ? "🚨" : "🔔", items.length === 1 ? `New decision signal · ${URG[items[0].detail?.urgency] || ""}` : `${items.length} new decision signals`,
    urgent ? `${urgent} urgent — the brain just spotted ${urgent === 1 ? "it" : "them"}` : "The brain just spotted this from the latest data",
    { tone: urgent ? "bad" : "", onclick: () => showTab("signals") });
  loadSignals();
});
const onMemory = SB.batcher(1500, (items) => {
  SB.toast("🧠", items.length === 1 ? "New knowledge in the brain" : `${items.length} new memories`,
    `Added by ${[...new Set(items.map((m) => m.by_user || "someone"))].join(", ")} in ${items[0].brain.split(".").pop()}`);
});
function goLive() {
  SB.live("/live/credentials", { "X-User-Id": state.user }, (topic, m) => {
    if (m.signal_id) onSignals(m);
    else if (m.memory_id && m.by_user !== state.user) onMemory(m);
  });
}
userSelect.onchange = () => {
  state.user = userSelect.value;
  goLive();
  $("who-eyebrow").textContent = "Lumen Home · " + who();
  const url = new URL(location); url.searchParams.set("user", state.user); history.replaceState(null, "", url);
  loadSignals(); loadProducts();
  if (!$("tab-evolution").classList.contains("hidden")) loadEvolution();
  if ($("query").value) search($("query").value);
};
init();

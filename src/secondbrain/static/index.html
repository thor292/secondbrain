<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondBrain</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%238b7bff'/></svg>">
<link rel="stylesheet" href="/static/sb.css">
<style>
  body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } .side { display: none; } }

  /* People */
  .side { border-right: 1px solid var(--border); overflow-y: auto; padding: 18px 14px; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  .side .co { margin: 16px 6px 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .side .co:first-child { margin-top: 2px; }
  .who { width: 100%; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 12px;
         border: 1px solid transparent; background: transparent; cursor: pointer; transition: .2s; color: var(--text); }
  .who:hover { background: var(--panel-hi); }
  .who.on { background: var(--accent-soft); border-color: rgba(139,123,255,.4); }
  .who .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .who b { display: block; font-size: 14px; font-weight: 600; } .who small { color: var(--muted); font-size: 12px; }
  .side .co .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34d399; margin-left: 6px; vertical-align: 1px; box-shadow: 0 0 8px #34d399; }
  .who .av.glyph { font-size: 16px; }

  /* Conversation */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .stream { flex: 1; overflow-y: auto; padding: 28px 0 10px; }
  .inner { max-width: 820px; margin: 0 auto; padding: 0 22px; }
  .welcome { text-align: center; padding: 6vh 0 10px; }
  .welcome .orb { width: 92px; height: 92px; margin: 0 auto 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #c1b8ff, #6a5cf0 45%, #11183a 78%);
                  box-shadow: 0 0 70px rgba(139,123,255,.6); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 100px rgba(51,214,242,.5); } }
  .welcome h1 { font-size: 34px; letter-spacing: -0.03em; margin: 0 0 8px; }
  .welcome p { color: var(--muted); margin: 0 auto 24px; max-width: 520px; }
  .suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; text-align: left; }
  .suggest button { padding: 14px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); cursor: pointer; color: var(--text); font-size: 14px; transition: .2s; }
  .suggest button:hover { border-color: rgba(139,123,255,.5); transform: translateY(-2px); }
  .suggest button small { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }

  .msg { display: flex; gap: 12px; margin: 18px 0; animation: rise .4s cubic-bezier(.2,.8,.2,1) both; }
  .msg .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 14px; }
  .msg.q { flex-direction: row-reverse; }
  .msg.q .bubble { background: var(--grad); color: #fff; border-radius: 18px 18px 4px 18px; padding: 12px 16px; max-width: 75%; box-shadow: 0 10px 30px -14px rgba(139,123,255,.8); }
  .msg.a .body { flex: 1; min-width: 0; }
  .msg.a .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: 4px 18px 18px 18px; padding: 14px 18px; line-height: 1.6; }
  .msg.a .bubble b { color: var(--cyan); }
  .msg.a .bubble { white-space: pre-line; }
  .msg.note { justify-content: center; } .msg.note span { font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); padding: 5px 12px; border-radius: 999px; }
  .brain-av { background: radial-gradient(circle at 35% 35%, #c1b8ff, #6a5cf0 60%, #1b2350); box-shadow: 0 0 16px rgba(139,123,255,.6); }

  /* Where the answer came from: the brains it searched, in order */
  .path { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; flex-wrap: wrap; }
  .hop { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--faint); font-weight: 600; }
  .hop.hit { color: var(--text); border-color: transparent; background: var(--grad); color: #fff; box-shadow: 0 0 14px rgba(51,214,242,.45); }
  .hop.miss { text-decoration: line-through; }
  .path .arrow { color: var(--faint); }
  .understood { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .sources { display: grid; gap: 8px; margin-top: 10px; }
  .src { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  .src .meta { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .src .meta .chip { font-size: 11px; padding: 1px 8px; }
  .srcs-toggle { margin-top: 8px; }

  .thinking { display: flex; gap: 12px; align-items: center; margin: 18px 0; color: var(--muted); font-size: 13.5px; }
  .dots { display: inline-flex; gap: 4px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: bounce 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-6px); opacity: 1; } }

  /* Composer */
  .composer { padding: 12px 0 20px; }
  .box { background: var(--panel); border: 1px solid var(--border-hi); border-radius: 18px; padding: 10px; box-shadow: var(--shadow); }
  .box:focus-within { border-color: rgba(139,123,255,.6); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
  .box textarea { width: 100%; border: 0; background: transparent; resize: none; padding: 8px 10px; font-size: 15.5px; outline: none; box-shadow: none; min-height: 48px; max-height: 160px; }
  .box .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .box .bar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .box select { padding: 6px 10px; font-size: 13px; }
  .hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 8px; }
  .model { font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="people"><div class="shimmer" style="height:300px"></div></aside>
  <section class="main">
    <div class="stream" id="stream"><div class="inner" id="messages"></div></div>
    <div class="composer"><div class="inner">
      <form class="box" id="form">
        <textarea id="input" rows="1" placeholder="Pick a person on the left, then ask the brain anything…"></textarea>
        <div class="bar">
          <div class="seg" id="mode"><button type="button" data-mode="ask" class="on">Ask</button><button type="button" data-mode="remember">Remember</button></div>
          <select id="sensitivity" class="hidden" title="Who may read this note">
            <option value="internal">Internal</option><option value="public">Public</option><option value="restricted">Restricted</option>
          </select>
          <button type="button" class="btn ghost sm hidden" id="consolidate" title="Move short-term notes into long-term memory">Save to long-term</button>
          <div class="right">
            <button type="button" class="btn ghost sm" id="new-conversation" title="Forget the questions asked so far">↺ New chat</button>
            <button class="btn primary sm" id="send">Send ➤</button>
          </div>
        </div>
      </form>
      <div class="hint" id="hint">Searches your department first, then your company. Never another company.</div>
    </div></div>
  </section>
</div>
<script src="/static/sb.js"></script>
<script>
const { el } = SB;
const $ = (id) => document.getElementById(id);
const modelInfo = el("span", { class: "model" });
SB.nav("chat", modelInfo);
const state = { user: null, mode: "ask", users: [] };
const COLORS = ["#8b7bff", "#33d6f2", "#f472b6", "#fb923c", "#34d399", "#fbbf24", "#60a5fa", "#a78bfa"];
const colorFor = (id) => COLORS[[...id].reduce((t, c) => t + c.charCodeAt(0), 0) % COLORS.length];
// Questions that show the brain at its best, per person in the example companies.
const SUGGEST = {};   // per-person suggestions; everyone gets GENERIC
// Platforms (live): questions over the Live Commerce engine, one scope each (HQ, a platform, a merchant).
const COMMERCE = [
  { id: "commerce:hq", level: "hq", sid: null, name: "SecondBrain HQ", sub: "All Shoppi merchants", color: "#8b7bff", glyph: "✦" },
  { id: "commerce:shoppi", level: "platform", sid: "shoppi", name: "Shoppi", sub: "Haldiram's, BigBasket, FabIndia, Bata", color: "#E4572E" },
  { id: "commerce:shoppi-haldirams", level: "merchant", sid: "shoppi-haldirams", name: "Haldiram's", sub: "Shoppi merchant", color: "#E4572E" },
  { id: "commerce:shoppi-bigbasket", level: "merchant", sid: "shoppi-bigbasket", name: "BigBasket", sub: "Shoppi merchant", color: "#E4572E" },
  { id: "commerce:shoppi-fabindia", level: "merchant", sid: "shoppi-fabindia", name: "FabIndia", sub: "Shoppi merchant", color: "#E4572E" },
  { id: "commerce:shoppi-bata", level: "merchant", sid: "shoppi-bata", name: "Bata", sub: "Shoppi merchant", color: "#E4572E" },
].map((p) => ({ ...p, commerce: true }));
const COMMERCE_SUGGEST = {
  hq: [["Where should we act first across all merchants?", "Most valuable open signals"], ["Which merchants need restocking today?", "Restock across the network"],
       ["What has the brain learned about pricing?", "Lessons from measured offers"], ["How accurate are the forecasts?", "Live forecast accuracy"]],
  shoppi: [["Which merchants need attention now?", "Open signals"], ["Which offers worked best this week?", "Measured offer outcomes"],
           ["Which categories should we not discount?", "Margin protection"]],
  merchant: [["What should we restock today?", "Your stock and lead times"], ["Did our last offers work?", "Measured outcomes"],
             ["Which products will run out first?", "Stock cover"]],
};
const GENERIC = [["Which products had a price increase?", "Catalog and price changes"], ["Which products are selling more than last month?", "Sales trends"], ["Which products are low on stock?", "Stock cover"]];

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (state.user && !state.user.commerce) headers["X-User-Id"] = state.user.id;
  const res = await fetch(path, { ...options, headers });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}
const role = (u) => u.commerce ? u.sub : (u.name.match(/\((.*)\)/) || [])[1] || u.brain_name;
const short = (u) => u.name.replace(/\s*\(.*\)/, "");
const avatar = (u, cls = "av") => u.commerce
  ? el("div", { class: cls + (u.glyph ? " glyph" : ""), style: { background: u.color } }, u.glyph || u.name[0])
  : el("div", { class: cls, style: { background: colorFor(u.id) } }, short(u)[0]);
const HINT = $("hint").textContent;
function scroll() { const s = $("stream"); s.scrollTo({ top: s.scrollHeight, behavior: "smooth" }); }
function add(node) { $("messages").append(node); scroll(); return node; }
const note = (text) => add(el("div", { class: "msg note" }, el("span", {}, text)));

function welcome() {
  const u = state.user;
  if (u && u.commerce) return commerceWelcome(u);
  const items = u ? SUGGEST[u.id] || GENERIC : [];
  $("messages").replaceChildren(el("div", { class: "welcome rise" }, el("div", { class: "orb" }),
    el("h1", {}, u ? `Hi ${short(u).split(" ")[0]}, ask your ` : "Ask your ", el("span", { class: "grad-text" }, "second brain")),
    el("p", {}, u ? `${role(u)} · ${u.brain_name}. Answers come from what your team knows, with sources, and only what you're allowed to see.`
                  : "Pick a person on the left to see the company through their eyes."),
    u ? el("div", { class: "suggest" }, items.map(([q, why]) => el("button", { type: "button", onclick: () => ask(q) }, q, el("small", {}, why)))) : null));
}

function commerceWelcome(u) {
  const items = COMMERCE_SUGGEST[u.sid] || COMMERCE_SUGGEST[u.level] || COMMERCE_SUGGEST.hq;
  const what = u.level === "hq" ? "every platform and merchant" : u.level === "platform" ? `${u.name} and its merchants` : `${u.name} only`;
  $("messages").replaceChildren(el("div", { class: "welcome rise" }, el("div", { class: "orb" }),
    el("h1", {}, "Ask ", el("span", { class: "grad-text" }, u.level === "hq" ? "SecondBrain HQ" : u.name)),
    el("p", {}, `${u.sub} · live platform data. Answers come from what the engine sees right now for ${what}, with sources.`),
    el("div", { class: "suggest" }, items.map(([q, why]) => el("button", { type: "button", onclick: () => ask(q) }, q, el("small", {}, why))))));
}

// The live personas: HQ, the Shoppi platform and its merchants (names and cities from the engine).
async function commercePersonas() {
  const list = COMMERCE.map((p) => ({ ...p }));
  try {
    const ms = await api("/commerce/api/merchants");
    for (const p of list) {
      const m = ms.find((x) => x.id === p.sid);
      if (m) Object.assign(p, { name: m.name, sub: `Shoppi · ${m.city}` });
    }
  } catch (e) { /* engine offline: the entries stay, asking says so */ }
  return list;
}

async function loadUsers() {
  try {
    const [all, personas] = await Promise.all([api("/demo/users"), commercePersonas()]);
    const people = all;   // every onboarded company's people
    state.users = [...personas, ...people];
    const box = $("people"), groups = {};
    for (const u of people) (groups[u.home_brain.split(".")[1]] ||= []).push(u);
    box.replaceChildren(
      el("div", { class: "co" }, "Platforms (live)", el("span", { class: "live-dot", title: "Live Commerce engine" })),
      ...personas.map((u) => el("button", { class: "who", "data-id": u.id, onclick: () => pick(u) }, avatar(u), el("div", {}, el("b", {}, u.name), el("small", {}, u.sub)))),
      ...Object.entries(groups).flatMap(([co, users]) => [
      el("div", { class: "co" }, users[0].brain_name && users[0].home_brain.split(".").length === 2 ? users[0].brain_name : co),
      ...users.map((u) => el("button", { class: "who", "data-id": u.id, onclick: () => pick(u) }, avatar(u), el("div", {}, el("b", {}, short(u)), el("small", {}, role(u))))),
    ]));
    const wanted = new URLSearchParams(location.search).get("user");
    const first = state.users.find((u) => u.id === wanted);
    if (first) pick(first); else welcome();
  } catch (e) { $("people").replaceChildren(el("div", { class: "empty" }, "Couldn't load people: " + e.message)); }
}

function pick(u) {
  state.user = u;
  document.querySelectorAll(".who").forEach((b) => b.classList.toggle("on", b.dataset.id === u.id));
  const url = new URL(location); url.searchParams.set("user", u.id); history.replaceState(null, "", url);
  $("hint").textContent = u.commerce ? "Answers only from the live platform data in this scope. Other merchants' data never reaches the model." : HINT;
  if (u.commerce) {
    SB.live("/live/credentials", { "X-User-Id": "" }, () => {});   // closes the previous person's live notices
    $("input").placeholder = `Ask ${u.level === "hq" ? "SecondBrain HQ" : u.name} about the live platforms…`;
    return welcome();
  }
  document.querySelectorAll(".sb-links a").forEach((a) => { if (a.pathname !== "/" && a.pathname !== "/hq") a.href = a.pathname + "?user=" + encodeURIComponent(u.id); });
  $("input").placeholder = state.mode === "ask" ? `Ask as ${short(u)}…` : "Tell the brain something to remember…";
  welcome();
  SB.live("/live/credentials", { "X-User-Id": u.id }, (topic, m) => {
    if (m.event === "inbox" && m.outcome === "saved") SB.toast("✅", "Saved to long-term memory", `${m.count} note${m.count === 1 ? "" : "s"} — your team can now ask about ${m.count === 1 ? "it" : "them"}`, { tone: "good" });
    else if (m.memory_id && m.by_user !== u.id) onMemory(m);
    else if (m.signal_id) onSignal(m);
  });
}
const onMemory = SB.batcher(1500, (items) => SB.toast("🧠", items.length === 1 ? "New knowledge just arrived" : `${items.length} new memories`,
  `From ${[...new Set(items.map((m) => m.by_user || "someone"))].join(", ")} · ask about it now`));
const onSignal = SB.batcher(1500, (items) => SB.toast("🔔", items.length === 1 ? "New decision signal" : `${items.length} new decision signals`,
  "Open Explore to see what the brain recommends", { onclick: () => (location.href = "/explore?user=" + encodeURIComponent(state.user.id)) }));

function formatted(text) {
  const p = el("div", { class: "bubble" });
  text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => p.append(i % 2 ? el("b", {}, part) : document.createTextNode(part)));
  return p;
}

function answerNode(r, question) {
  const u = state.user, dept = u.brain_name, isCompanyUser = u.home_brain.split(".").length === 2;
  const hops = isCompanyUser ? [["company", "Company brain"]] : [["department", dept], ["company", "Company brain"]];
  const path = el("div", { class: "path" }, el("span", { class: "muted" }, "Searched:"),
    hops.flatMap(([k, label], i) => {
      const hit = r.answered_from === k, missed = !hit && (r.answered_from === "none" || hops.findIndex(([x]) => x === r.answered_from) > i);
      return [i ? el("span", { class: "arrow" }, "→") : null, el("span", { class: "hop " + (hit ? "hit" : missed ? "miss" : "") }, (hit ? "✓ " : "") + label)];
    }),
    r.answered_from === "none" ? el("span", { class: "chip bad" }, "Not found in what you may see") : null);
  const body = el("div", { class: "body" }, path, formatted(r.answer));
  if (r.searched_for && r.searched_for.trim().toLowerCase() !== question.trim().toLowerCase())
    body.append(el("div", { class: "understood" }, "↳ Understood as: " + r.searched_for));
  if (r.sources.length) {
    const list = el("div", { class: "sources hidden" }, r.sources.map((s, i) => el("div", { class: "src" },
      el("div", { class: "meta" }, el("span", { class: "chip accent" }, `[${i + 1}] ${s.brain.split(".").pop()}`), el("span", { class: "chip" }, s.type),
        el("span", { class: "chip", title: "Closer is more relevant" }, `match ${Math.round((1 - s.distance) * 100)}%`)), s.content)));
    const toggle = el("button", { type: "button", class: "btn ghost sm srcs-toggle", onclick: () => {
      list.classList.toggle("hidden"); toggle.textContent = list.classList.contains("hidden") ? `📎 ${r.sources.length} source${r.sources.length > 1 ? "s" : ""}` : "Hide sources"; } },
      `📎 ${r.sources.length} source${r.sources.length > 1 ? "s" : ""}`);
    body.append(toggle, list);
  }
  return el("div", { class: "msg a" }, el("div", { class: "av brain-av" }, "✦"), body);
}

function commerceAnswerNode(r) {
  const s = r.scope || {};
  const path = el("div", { class: "path" }, el("span", { class: "muted" }, "Scope:"), el("span", { class: "hop hit" }, "✓ " + (s.label || state.user.name)),
    el("span", { class: "chip" }, "live data"));
  const body = el("div", { class: "body" }, path, formatted(r.answer));
  if (r.sources && r.sources.length) {
    const list = el("div", { class: "sources hidden" }, r.sources.map((x) => el("div", { class: "src" },
      el("div", { class: "meta" }, el("span", { class: "chip accent" }, `[${x.tag || "•"}] ${x.kind}`), el("span", { class: "chip" }, x.id)), x.title)));
    const label = `📎 ${r.sources.length} source${r.sources.length > 1 ? "s" : ""}`;
    const toggle = el("button", { type: "button", class: "btn ghost sm srcs-toggle", onclick: () => {
      list.classList.toggle("hidden"); toggle.textContent = list.classList.contains("hidden") ? label : "Hide sources"; } }, label);
    body.append(toggle, list);
  }
  return el("div", { class: "msg a" }, el("div", { class: "av brain-av" }, "✦"), body);
}

async function askCommerce(question) {
  const u = state.user;
  const steps = ["Reading the live platform data", u.level === "merchant" ? `Keeping to ${u.name}'s own data` : "Ranking what needs attention", "Writing the answer"];
  const label = el("span", {}, steps[0]);
  const thinking = add(el("div", { class: "thinking" }, el("div", { class: "av brain-av", style: { width: "34px", height: "34px", borderRadius: "50%" } }),
    el("span", { class: "dots" }, el("i"), el("i"), el("i")), label));
  let i = 0; const timer = setInterval(() => { if (i < steps.length - 1) label.textContent = steps[++i]; }, 1500);
  try {
    const r = await api("/commerce/ask", { method: "POST", body: JSON.stringify({ question, scope: { level: u.level, id: u.sid } }) });
    thinking.replaceWith(commerceAnswerNode(r)); scroll();
  } catch (e) { thinking.remove(); note("Error: " + e.message); }
  finally { clearInterval(timer); }
}

async function ask(question) {
  if (!state.user) return note("Pick a person on the left first.");
  if (state.user.commerce) {
    $("messages").querySelector(".welcome")?.remove();
    add(el("div", { class: "msg q" }, avatar(state.user), el("div", { class: "bubble" }, question)));
    return askCommerce(question);
  }
  $("messages").querySelector(".welcome")?.remove();
  add(el("div", { class: "msg q" }, avatar(state.user), el("div", { class: "bubble" }, question)));
  const u = state.user, steps = u.home_brain.split(".").length === 2 ? ["Searching the company brain"] : [`Searching ${u.brain_name}`, "Checking the company brain", "Writing the answer"];
  const label = el("span", {}, steps[0]);
  const thinking = add(el("div", { class: "thinking" }, el("div", { class: "av brain-av", style: { width: "34px", height: "34px", borderRadius: "50%" } }),
    el("span", { class: "dots" }, el("i"), el("i"), el("i")), label));
  let i = 0; const timer = setInterval(() => { if (i < steps.length - 1) label.textContent = steps[++i]; }, 1800);
  try { const r = await api("/ask", { method: "POST", body: JSON.stringify({ question }) }); thinking.replaceWith(answerNode(r, question)); scroll(); }
  catch (e) { thinking.remove(); note("Error: " + e.message); }
  finally { clearInterval(timer); }
}

async function remember(content) {
  if (!state.user) return note("Pick a person on the left first.");
  if (state.user.commerce) return note("Remember is for people's notes; the platform views read live data. Pick a person to add a note.");
  $("messages").querySelector(".welcome")?.remove();
  add(el("div", { class: "msg q" }, avatar(state.user), el("div", { class: "bubble" }, "📝 " + content)));
  try {
    const item = await api("/remember", { method: "POST", body: JSON.stringify({ content, sensitivity: $("sensitivity").value }) });
    note(`Remembered as ${item.memory_type} memory · ${$("sensitivity").value}. Save to long-term to make it searchable.`);
  } catch (e) { note("Error: " + e.message); }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = ""; $("input").style.height = "";
  state.mode === "ask" ? ask(text) : remember(text);
};
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
$("input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
document.querySelectorAll("#mode button").forEach((b) => (b.onclick = () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll("#mode button").forEach((x) => x.classList.toggle("on", x === b));
  $("sensitivity").classList.toggle("hidden", state.mode !== "remember");
  $("consolidate").classList.toggle("hidden", state.mode !== "remember");
  $("input").placeholder = state.mode === "ask" ? "Ask the brain anything…" : "Tell the brain something to remember…";
}));
$("consolidate").onclick = async () => {
  if (!state.user) return note("Pick a person on the left first.");
  if (state.user.commerce) return note("Pick a person to save notes to long-term memory.");
  try { const r = await api("/consolidate", { method: "POST" }); note(r.consolidated ? `Saved ${r.consolidated} note(s) to long-term memory` : "Nothing waiting in short-term memory"); }
  catch (e) { note("Error: " + e.message); }
};
$("new-conversation").onclick = async () => {
  if (!state.user) return;
  if (state.user.commerce) return welcome();
  try { await api("/conversation/reset", { method: "POST" }); welcome(); } catch (e) { note("Error: " + e.message); }
};
api("/health").then((h) => (modelInfo.textContent = `${h.llm} · ${h.embedding_model}`)).catch(() => {});
loadUsers();
</script>
</body>
</html>

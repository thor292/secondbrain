[project]
name = "secondbrain"
version = "0.1.0"
description = "A tree of connected Second Brains with five memory types"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "falkordb>=1.8.1",
    "statsforecast>=2.0.1",
    "pandas>=3.1.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "reportlab>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secondbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

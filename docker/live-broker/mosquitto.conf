# Live-notification broker (people's screens). passwd and acl are GENERATED from the
# grants table by `python -m secondbrain.live sync` - do not edit them by hand.
# Dev only: plain TCP and ws://. Production: 8883 + wss:// with TLS (docs/LIVE.md).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883

listener 9001
protocol websockets
